# Builds, tests and deploys to the TEST Function App on push to main (or when started by hand,
# on any branch: Actions → this workflow → Run workflow → pick the branch).
# Docs for the deploy action: https://github.com/azure/functions-action
# Deploys with GitHub OIDC: the deploy job runs in the GitHub environment "test", whose variables
# AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID name the deploy identity in
# LZ - Masseutsendelse (terraform/github_deploy.tf). No publish profile.

name: Build and deploy to Azure Function App - TEST

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '24.x'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm test: lint, typecheck, unit tests, contract tests, build
      - name: Install, build and test
        shell: bash
        run: |
          npm ci
          npm test

      # Only runtime dependencies go to Azure; .funcignore leaves out src and test
      - name: Remove dev dependencies
        shell: bash
        run: npm prune --omit=dev

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: 'tfkdlzmasseutmatrklapi'
          slot-name: 'Production'
          package: '.'
