# Builds, tests and deploys to the PROD Function App when a release is published.
# Docs for the deploy action: https://github.com/azure/functions-action

name: Build and deploy to Azure Function App - PROD

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  NODE_VERSION: '24.x'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm test: lint, typecheck, unit tests, contract tests, build
      - name: Install, build and test
        shell: bash
        run: |
          npm ci
          npm test

      # Only runtime dependencies go to Azure; .funcignore leaves out src and test
      - name: Remove dev dependencies
        shell: bash
        run: npm prune --omit=dev

      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: 'tfkplzmasseutmatrklapi'
          slot-name: 'Production'
          package: '.'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PROD }}
